<!DOCTYPE html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><title>ZoomOut — share card</title>
<meta name="design_doc_mode" content="canvas">
<link rel="stylesheet" href="_ds/zoomout-design-system-442bf93e-11be-447f-b4c6-087de7180cb9/tokens/fonts.css">
<link rel="stylesheet" href="_ds/zoomout-design-system-442bf93e-11be-447f-b4c6-087de7180cb9/tokens/colors.css">
<link rel="stylesheet" href="_ds/zoomout-design-system-442bf93e-11be-447f-b4c6-087de7180cb9/tokens/typography.css">
<link rel="stylesheet" href="_ds/zoomout-design-system-442bf93e-11be-447f-b4c6-087de7180cb9/tokens/base.css">
<style>
body{background:#e8e8e8}
.lbl{position:absolute;top:-30px;left:0;font-family:var(--font-display);font-weight:600;font-size:12px;letter-spacing:0.6px;text-transform:uppercase;color:#555}
.frame{position:absolute}
/* Generic neutral feed chrome — deliberately not any real app's UI, just enough context to judge the card in. */
.feed{width:400px;background:#fff;border:1px solid #d7d7d7;border-radius:14px;overflow:hidden;font-family:-apple-system,Helvetica,Arial,sans-serif;box-shadow:0 20px 40px -20px rgba(0,0,0,0.25)}
.ghost{height:34px;background:#f2f2f2;border-bottom:1px solid #e6e6e6}
.postrow{display:flex;align-items:center;gap:10px;padding:12px 14px}
.avatar{width:34px;height:34px;border-radius:50%;background:#d9d9d9}
.who{display:flex;flex-direction:column;gap:1px}
.who b{font-size:13px;color:#1a1a1a}
.who span{font-size:11px;color:#8a8a8a}
.dots{margin-left:auto;color:#8a8a8a;font-size:16px}
.icons{display:flex;gap:14px;padding:10px 14px 4px;color:#333}
.cap{padding:0 14px 14px;font-size:13px;color:#1a1a1a;line-height:1.4}
.cap b{margin-right:5px}
/* The card itself — light theme only, brand fonts, three pieces of information. */
.card{background:var(--surface-page);position:relative;overflow:hidden;display:flex;flex-direction:column}
.card.sq{width:400px;height:400px}
.card.vert{width:400px;height:711px}
.brand{position:absolute;top:22px;left:22px;display:flex;align-items:center;gap:7px}
.brand svg{display:block}
.brand span{font-family:var(--font-display);font-weight:700;font-size:14px;color:var(--text-heading)}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.num{font-family:var(--font-display);font-weight:700;font-size:132px;line-height:1;color:var(--reward);letter-spacing:-2px}
.numlbl{font-family:var(--font-display);font-weight:600;font-size:14px;letter-spacing:1px;text-transform:uppercase;color:var(--text-secondary)}
.frag{width:100%;height:96px}
.book{padding:16px 0 26px;text-align:center;font-family:var(--font-display);font-weight:600;font-size:14px;color:var(--text-secondary)}
.thumbrow{display:flex;gap:18px;align-items:flex-end}
.thumb{border:1px solid #ccc}
</style>
</head><body>

<div class="frame" style="left:40px;top:70px"><span class="lbl">Square — in a mock feed</span>
<div class="feed"><div class="ghost"></div>
<div class="postrow"><div class="avatar"></div><div class="who"><b>you</b><span>2m</span></div><span class="dots">⋯</span></div>
<div class="card sq" id="sq"></div>
<div class="icons"><span>♡</span><span>◯</span><span>↗</span></div>
<div class="cap"><b>you</b>Finished today’s session.</div>
<div class="ghost"></div></div></div>

<div class="frame" style="left:520px;top:70px"><span class="lbl">9:16 — in a mock feed</span>
<div class="feed"><div class="ghost"></div>
<div class="postrow"><div class="avatar"></div><div class="who"><b>you</b><span>just now</span></div><span class="dots">⋯</span></div>
<div class="card vert" id="vert"></div>
<div class="icons"><span>♡</span><span>◯</span><span>↗</span></div>
<div class="cap"><b>you</b>Finished the track.</div>
<div class="ghost"></div></div></div>

<div class="frame" style="left:1000px;top:70px"><span class="lbl">At thumbnail size</span>
<div class="thumbrow">
<div class="thumb" style="width:96px;height:96px;overflow:hidden"><div style="width:400px;height:400px;transform:scale(0.24);transform-origin:top left" id="sq-thumb"></div></div>
<div class="thumb" style="width:96px;height:171px;overflow:hidden"><div style="width:400px;height:711px;transform:scale(0.24);transform-origin:top left" id="vert-thumb"></div></div>
</div></div>

<script>
function prng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function curve(x,y,a,len,bend){const ex=x+Math.cos(a)*len,ey=y+Math.sin(a)*len,nx=-Math.sin(a),ny=Math.cos(a),o=len*bend;
return{ex,ey,d:'M '+x.toFixed(1)+' '+y.toFixed(1)+' C '+(x+Math.cos(a)*len*0.34+nx*o*0.3).toFixed(1)+' '+(y+Math.sin(a)*len*0.34+ny*o*0.3).toFixed(1)+', '+(x+Math.cos(a)*len*0.68+nx*o*0.46).toFixed(1)+' '+(y+Math.sin(a)*len*0.68+ny*o*0.46).toFixed(1)+', '+ex.toFixed(1)+' '+ey.toFixed(1)}}
function spinePath(pts){let d='M '+pts[0].x.toFixed(1)+' '+pts[0].y.toFixed(1);
for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||pts[i+1];
d+=' C '+(p1.x+(p2.x-p0.x)/6).toFixed(1)+' '+(p1.y+(p2.y-p0.y)/6).toFixed(1)+', '+(p2.x-(p3.x-p1.x)/6).toFixed(1)+' '+(p2.y-(p3.y-p1.y)/6).toFixed(1)+', '+p2.x.toFixed(1)+' '+p2.y.toFixed(1)}
return d}
function fragment(seed){const rand=prng(seed),pts=[];for(let i=0;i<6;i++)pts.push({x:20+i*72,y:48+Math.sin(i*1.3+seed)*30});
let svg='<path d="'+spinePath(pts)+'" fill="none" stroke="var(--graph-edge-reached)" stroke-width="2"/>';
pts.forEach((p,i)=>{for(let k=0;k<2;k++){const ang=rand()*Math.PI*2,c=curve(p.x,p.y,ang,10+rand()*16,(rand()-0.5)*1.8);
svg+='<path d="'+c.d+'" fill="none" stroke="var(--primary)" stroke-width="1.2" opacity="0.7"/>'}
svg+='<circle cx="'+p.x+'" cy="'+p.y+'" r="4.5" fill="var(--surface-page)" stroke="var(--reward)" stroke-width="1.3"/><circle cx="'+p.x+'" cy="'+p.y+'" r="2" fill="var(--reward)"/>'});
return '<svg viewBox="0 0 400 96" width="100%" height="96">'+svg+'</svg>'}
function wordmark(){return '<svg width="18" height="18" viewBox="0 0 18 18"><circle cx="3" cy="14" r="1.6" fill="var(--primary)"/><circle cx="9" cy="4" r="1.6" fill="var(--primary)"/><circle cx="15" cy="10" r="1.6" fill="var(--primary)"/><path d="M3 14 L9 4 L15 10" stroke="var(--primary)" stroke-width="1.3" fill="none"/></svg>'}
function card(num,label,book){return '<div class="brand">'+wordmark()+'<span>ZoomOut</span></div><div class="mid"><div class="num">'+num+'</div><div class="numlbl">'+label+'</div></div><div class="frag">'+fragment(71)+'</div><div class="book">'+book+'</div>'}
const sq=card('14','Day streak','The Quiet Arithmetic');
const vert=card('720','XP earned','The Quiet Arithmetic \u2014 complete');
document.getElementById('sq').innerHTML=sq;
document.getElementById('vert').innerHTML=vert;
document.getElementById('sq-thumb').innerHTML='<div class="card sq">'+sq+'</div>';
document.getElementById('vert-thumb').innerHTML='<div class="card vert">'+vert+'</div>';
</script>
</body></html>
