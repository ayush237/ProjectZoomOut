<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>ZoomOut — track complete</title>
<meta name="design_doc_mode" content="canvas">
<link rel="stylesheet" href="_ds/zoomout-design-system-442bf93e-11be-447f-b4c6-087de7180cb9/tokens/fonts.css">
<link rel="stylesheet" href="_ds/zoomout-design-system-442bf93e-11be-447f-b4c6-087de7180cb9/tokens/colors.css">
<link rel="stylesheet" href="_ds/zoomout-design-system-442bf93e-11be-447f-b4c6-087de7180cb9/tokens/typography.css">
<link rel="stylesheet" href="_ds/zoomout-design-system-442bf93e-11be-447f-b4c6-087de7180cb9/tokens/spacing.css">
<link rel="stylesheet" href="_ds/zoomout-design-system-442bf93e-11be-447f-b4c6-087de7180cb9/tokens/base.css">
<style>
body{background:var(--surface-page)}
.lbl{position:absolute;top:-30px;left:0;font-family:var(--font-display);font-weight:600;font-size:12px;letter-spacing:0.6px;text-transform:uppercase;color:var(--text-secondary)}
.frame{position:absolute}
.phone{width:390px;height:844px;background:var(--surface-page);border:1px solid var(--border-hairline);border-radius:20px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.hd{display:flex;align-items:center;justify-content:space-between;padding:26px 22px 0}
.hd .x{width:32px;height:32px;border-radius:50%;background:var(--surface-raised);border:1px solid var(--border-hairline);display:grid;place-items:center;color:var(--text-secondary);font-size:14px}
.eyebrow{font-family:var(--font-display);font-weight:600;font-size:11px;letter-spacing:0.6px;text-transform:uppercase;color:var(--reward);text-align:center}
.title{font-family:var(--font-display);font-weight:700;font-size:24px;line-height:1.2;color:var(--text-heading);text-align:center;margin:6px 0 2px}
.author{font-family:var(--font-body);font-size:13px;color:var(--text-secondary);text-align:center}
.gwrap{position:relative;flex:1;display:flex;align-items:center;justify-content:center;margin:6px 8px}
.gwrap svg{width:100%;height:auto}
.stats{display:flex;gap:0;padding:0 24px;justify-content:space-between}
.stat{display:flex;flex-direction:column;gap:2px;align-items:center;flex:1}
.stat b{font-family:var(--font-display);font-weight:700;font-size:21px;color:var(--text-heading)}
.stat span{font-family:var(--font-display);font-weight:600;font-size:10.5px;letter-spacing:0.5px;text-transform:uppercase;color:var(--text-secondary)}
.actions{display:flex;flex-direction:column;gap:10px;padding:18px 22px 0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:var(--radius-sm);font-family:var(--font-display);font-weight:700;font-size:15.5px}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.secondary{background:transparent;border:1px solid var(--border-hairline);color:var(--text-body)}
.legal{padding:14px 24px 26px;display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--border-hairline);margin-top:14px}
.legal p{margin:0;font-family:var(--font-body);font-size:11px;line-height:1.5;color:var(--text-secondary)}
.legal a{font-family:var(--font-body);font-size:11.5px;color:var(--text-link);text-decoration:none}
.dim{opacity:0.35}
.leaf-hd{padding:28px 24px 0;display:flex;align-items:center;justify-content:space-between}
.leaf-hd .dot{color:var(--text-secondary);font-family:var(--font-display);font-weight:600;font-size:11px;letter-spacing:0.6px;text-transform:uppercase}
.leaf-progress{margin:16px 24px 0;height:4px;background:var(--border-hairline);border-radius:2px;overflow:hidden}
.leaf-progress i{display:block;width:100%;height:100%;background:var(--primary)}
.leaf-body{flex:1;padding:28px 24px;display:flex;flex-direction:column;gap:14px}
.leaf-body h2{margin:0;font-family:var(--font-display);font-weight:700;font-size:24px;line-height:1.25;color:var(--text-heading)}
.leaf-body p{margin:0;font-family:var(--font-body);font-size:15px;line-height:1.5;color:var(--text-secondary)}
.leaf-foot{padding:0 24px 30px}
</style>
</head><body>

<div class="frame" style="left:40px;top:70px"><span class="lbl">Still — track complete</span>
<div class="phone" id="still"></div></div>

<div class="frame" style="left:480px;top:70px"><span class="lbl">1 — before: finishing the last leaf</span>
<div class="phone"><div class="leaf-hd"><span class="dot">Leaf 18 · Takeaway</span><span class="dot">3 min</span></div>
<div class="leaf-progress"><i></i></div>
<div class="leaf-body">
<span class="eyebrow" style="text-align:left">Remember this</span>
<h2>Every anchor is a choice someone made — including the ones you make yourself.</h2>
</div>
<div class="leaf-foot"><div class="btn primary">Finish leaf</div></div></div></div>

<div class="frame" style="left:920px;top:70px"><span class="lbl">2 — fades to the graph</span>
<div class="phone" id="f2"></div></div>

<div class="frame" style="left:1360px;top:70px"><span class="lbl">3 — constellation resolves</span>
<div class="phone" id="f3"></div></div>

<div class="frame" style="left:1800px;top:70px"><span class="lbl">4 — settles (stats + actions)</span>
<div class="phone" id="f4"></div></div>

<script>
function prng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function curve(x,y,a,len,bend){const ex=x+Math.cos(a)*len,ey=y+Math.sin(a)*len,nx=-Math.sin(a),ny=Math.cos(a),o=len*bend;
return{ex,ey,d:'M '+x.toFixed(1)+' '+y.toFixed(1)+' C '+(x+Math.cos(a)*len*0.34+nx*o*0.3).toFixed(1)+' '+(y+Math.sin(a)*len*0.34+ny*o*0.3).toFixed(1)+', '+(x+Math.cos(a)*len*0.68+nx*o*0.46).toFixed(1)+' '+(y+Math.sin(a)*len*0.68+ny*o*0.46).toFixed(1)+', '+ex.toFixed(1)+' '+ey.toFixed(1)}}
function spinePath(pts){let d='M '+pts[0].x.toFixed(1)+' '+pts[0].y.toFixed(1);
for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||pts[i+1];
d+=' C '+(p1.x+(p2.x-p0.x)/6).toFixed(1)+' '+(p1.y+(p2.y-p0.y)/6).toFixed(1)+', '+(p2.x-(p3.x-p1.x)/6).toFixed(1)+' '+(p2.y-(p3.y-p1.y)/6).toFixed(1)+', '+p2.x.toFixed(1)+' '+p2.y.toFixed(1)}
return d}
function branch(out,rand,x,y,ang,len,w,depth,color,op){const bend=(rand()-0.5)*1.8,c=curve(x,y,ang,len,bend);
out.push('<path d="'+c.d+'" fill="none" stroke="'+color+'" stroke-width="'+w.toFixed(2)+'" opacity="'+op.toFixed(2)+'"/>');
if(depth<=0){const tips=2+Math.floor(rand()*3);
for(let i=0;i<tips;i++){const t=curve(c.ex,c.ey,ang+bend*0.7+(rand()-0.5)*2.2,len*(0.2+rand()*0.25),(rand()-0.5)*2.4);
out.push('<path d="'+t.d+'" fill="none" stroke="'+color+'" stroke-width="'+Math.max(0.3,w*0.5).toFixed(2)+'" opacity="'+(op*0.85).toFixed(2)+'"/>')}
return}
const kids=rand()>0.5?2:1;
for(let i=0;i<kids;i++){const spread=(rand()-0.5)*2.4;
branch(out,rand,c.ex,c.ey,ang+bend*0.8+spread,len*(0.5+rand()*0.24),Math.max(0.35,w*0.6),depth-1,color,op*0.92)}}
function buildGraph(reveal,brightness){const rand=prng(4471),pts=[],N=18;
for(let i=0;i<N;i++){const t=i/(N-1);pts.push({x:20+t*280,y:110+Math.sin(t*Math.PI*3.1+0.4)*68+Math.sin(t*Math.PI*7)*14})}
const litPts=pts.slice(0,reveal),unlitPts=pts.slice(reveal);let svg='';
unlitPts.forEach(p=>{svg+='<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="1.6" fill="var(--graph-node-unreached)" opacity="0.4"/>'});
if(litPts.length>1)svg+='<path d="'+spinePath(litPts)+'" fill="none" stroke="var(--graph-edge-reached)" stroke-width="1.75" opacity="'+brightness+'"/>';
const branches=[];
litPts.forEach(p=>{const count=3+Math.floor(rand()*2);
for(let k=0;k<count;k++){const ang=rand()*Math.PI*2,len=8+rand()*16;
branch(branches,rand,p.x+Math.cos(ang)*4,p.y+Math.sin(ang)*4,ang,len,1.1,2,'var(--primary)',0.5*brightness)}});
svg+=branches.join('');
litPts.forEach(p=>{svg+='<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="5" fill="var(--surface-page)" stroke="var(--reward)" stroke-width="1.4" opacity="'+brightness+'"/><circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="2.2" fill="var(--reward)" opacity="'+brightness+'"/>'});
return '<svg viewBox="0 0 320 220" role="img" aria-label="The completed track: every leaf connected into one constellation">'+svg+'</svg>'}
function screen({graph,statsOn,actionsOn,legalOn,titleOn,dim}){
return '<div class="hd"><span></span><span class="x">\u00d7</span></div>'
+'<div style="padding:0 24px">'+(titleOn?'<div class="eyebrow">Track complete</div><div class="title">The quiet arithmetic</div><div class="author">Marisol Vane</div>':'')+'</div>'
+'<div class="gwrap">'+graph+'</div>'
+(statsOn?'<div class="stats'+(dim?' dim':'')+'"><div class="stat"><b>720</b><span>XP earned</span></div><div class="stat"><b>14</b><span>Day streak</span></div><div class="stat"><b>13/18</b><span>First try</span></div></div>':'')
+(actionsOn?'<div class="actions'+(dim?' dim':'')+'"><div class="btn primary">Share your constellation</div><div class="btn secondary">Find your next book</div></div>':'')
+(legalOn?'<div class="legal"><p>This summary reflects ZoomOut\u2019s reading of the book\u2019s ideas. It is not endorsed by or affiliated with the author or publisher.</p><a href="#">Read the full book, The Quiet Arithmetic by Marisol Vane \u2192</a></div>':'');
}
document.getElementById('still').innerHTML=screen({graph:buildGraph(18,1),statsOn:true,actionsOn:true,legalOn:true,titleOn:true,dim:false});
document.getElementById('f2').innerHTML='<div class="hd"><span></span><span class="x">\u00d7</span></div><div class="gwrap">'+buildGraph(18,0.14)+'</div>';
document.getElementById('f3').innerHTML=screen({graph:buildGraph(18,0.75),statsOn:true,actionsOn:false,legalOn:false,titleOn:true,dim:true});
document.getElementById('f4').innerHTML=screen({graph:buildGraph(18,1),statsOn:true,actionsOn:true,legalOn:true,titleOn:true,dim:false});
</script>
</body></html>
