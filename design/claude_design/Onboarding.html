<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>ZoomOut — Onboarding</title>
<link rel="stylesheet" href="_ds/zoomout-design-system-442bf93e-11be-447f-b4c6-087de7180cb9/tokens/fonts.css">
<link rel="stylesheet" href="_ds/zoomout-design-system-442bf93e-11be-447f-b4c6-087de7180cb9/tokens/colors.css">
<link rel="stylesheet" href="_ds/zoomout-design-system-442bf93e-11be-447f-b4c6-087de7180cb9/tokens/typography.css">
<link rel="stylesheet" href="_ds/zoomout-design-system-442bf93e-11be-447f-b4c6-087de7180cb9/tokens/spacing.css">
<link rel="stylesheet" href="_ds/zoomout-design-system-442bf93e-11be-447f-b4c6-087de7180cb9/tokens/motion.css">
<link rel="stylesheet" href="_ds/zoomout-design-system-442bf93e-11be-447f-b4c6-087de7180cb9/tokens/base.css">
<link rel="stylesheet" href="_ds/zoomout-design-system-442bf93e-11be-447f-b4c6-087de7180cb9/styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);min-height:100vh}a{color:var(--text-link)}a:hover{color:var(--primary-hover)}
.rail{display:flex;gap:40px;padding:40px;align-items:flex-start;width:max-content}
.col{display:flex;flex-direction:column;gap:12px}
.col>.zo-caption{color:var(--text-secondary)}
.screen{position:relative;width:390px;height:844px;overflow:hidden;background:var(--surface-page);border:1px solid var(--border-hairline);display:flex;flex-direction:column}
.body{flex:1;min-height:0;display:flex;flex-direction:column;gap:var(--space-lg);padding:var(--space-lg) var(--gutter) 0}
.foot{padding:var(--space-lg) var(--gutter) var(--space-xl);display:flex;flex-direction:column;gap:var(--space-sm)}</style>
</head><body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.js"></script>
<script src="_ds/zoomout-design-system-442bf93e-11be-447f-b4c6-087de7180cb9/_ds_bundle.js"></script>
<script type="text/babel">
const {Button,Card,Icon,IconButton,Input,ProgressBar,SlideProgress,Switch,TrackCard}=window.ZoomOutDesignSystem_442bf9;
const TOPICS=['Decisions','Money','Habits','Teams','Attention','Persuasion','Risk','Learning'];
const CAPS=[{min:5,leaves:'2 leaves'},{min:10,leaves:'3 leaves'},{min:15,leaves:'5 leaves'}];
/* Ambient hairline web — the knowledge graph language, with no progress claim attached. */
function prng(seed){let s=seed;return()=>{s=(s*1664525+1013904223)%4294967296;return s/4294967296}}
function Web(){const r=prng(4711),W=350,H=210,pts=[];
for(let i=0;i<22;i+=1)pts.push({x:12+r()*(W-24),y:12+r()*(H-24),rad:1.1+r()*1.5});
const spine=[{x:34,y:168},{x:104,y:120},{x:178,y:146},{x:250,y:88},{x:316,y:52}];
const edges=[];pts.forEach((p,i)=>{const a=spine[i%spine.length];edges.push([p,a])});
return<svg viewBox={'0 0 '+W+' '+H} width="100%" height={H} role="img" aria-label="The knowledge graph: fine edges between precise nodes">
{edges.map(([p,a],i)=><line key={'e'+i} x1={p.x.toFixed(1)} y1={p.y.toFixed(1)} x2={a.x} y2={a.y} stroke="var(--graph-edge)" strokeWidth="1" opacity="0.5"/>)}
{pts.map((p,i)=><circle key={'n'+i} cx={p.x.toFixed(1)} cy={p.y.toFixed(1)} r={p.rad.toFixed(1)} fill="var(--graph-node-unreached)"/>)}
{spine.slice(1).map((p,i)=><line key={'s'+i} x1={spine[i].x} y1={spine[i].y} x2={p.x} y2={p.y} stroke="var(--primary)" strokeWidth="1.75"/>)}
{spine.map((p,i)=><circle key={'sn'+i} cx={p.x} cy={p.y} r={i===spine.length-1?5:4.5} fill={i===spine.length-1?'var(--surface-page)':'var(--primary)'} stroke="var(--primary)" strokeWidth={i===spine.length-1?2:0}/>)}
</svg>}
function Frame({label,children}){return<div className="col"><span className="zo-caption">{label}</span>{children}</div>}
/* Steps 2–5 share a header: back, step counter, and a hairline of progress. */
function StepHeader({step,skip}){return<header style={{padding:'8px var(--gutter) 0',display:'flex',flexDirection:'column',gap:'var(--space-md)'}}>
<div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:'var(--space-sm)',minHeight:44}}>
<IconButton icon="chevron-left" label="Back" style={{marginLeft:-10}}/>
<span className="zo-caption" style={{color:'var(--text-secondary)'}}>Step {step} of 4</span>
{skip?<button type="button" className="zo-caption" style={{minHeight:44,padding:'0 10px',marginRight:-10,background:'none',border:0,color:'var(--text-secondary)',cursor:'pointer'}}>Skip</button>:<span style={{width:44}}/>}</div>
<ProgressBar value={step/4} height={4}/></header>}
/* 1 — Welcome. No logo exists in the system, so the name is set in Nunito 700. */
function Welcome(){return<Frame label="1 · Welcome">
<div className="screen" data-screen-label="Welcome">
<div className="body" style={{justifyContent:'center',gap:'var(--space-xl)',paddingBottom:'var(--space-lg)'}}>
<Web/>
<div style={{display:'flex',flexDirection:'column',gap:'var(--space-md)'}}>
<span style={{fontFamily:'var(--font-display)',fontWeight:700,fontSize:'var(--text-display-size)',lineHeight:'var(--text-display-leading)',color:'var(--text-heading)'}}>ZoomOut</span>
<p className="zo-body" style={{margin:0,textWrap:'pretty'}}>One non-fiction book, broken into three-minute lessons. You answer a question on each one, and the idea stays.</p></div></div>
<div className="foot">
<Button fullWidth size="lg">Get started</Button>
<Button fullWidth size="lg" variant="ghost">I already have an account</Button></div>
</div></Frame>}
/* 2 — How it works. The recall gate is the product thesis, so it is stated up front. */
function How(){const rows=[
{icon:'book-open',title:'A leaf is five slides',body:'Summary, scenario, payoff, sticky notes, takeaway. About three minutes.'},
{icon:'lock',title:'The payoff stays locked',body:'You answer the scenario first. Getting it wrong is fine — you can try again.'},
{icon:'network',title:'Each leaf adds a node',body:'The track graph fills in as you go, so you can see how far into the book you are.'}];
return<Frame label="2 · How it works">
<div className="screen" data-screen-label="How it works">
<StepHeader step={1}/>
<div className="body">
<h1 style={{margin:0,fontFamily:'var(--font-display)',fontWeight:700,fontSize:'var(--text-h1-size)',lineHeight:'var(--text-h1-leading)',color:'var(--text-heading)',textWrap:'pretty'}}>How a lesson works</h1>
<Card style={{display:'flex',flexDirection:'column',gap:'var(--space-sm)'}}>
<span className="zo-caption" style={{color:'var(--text-secondary)'}}>One leaf · 5 slides</span>
<SlideProgress current={2}/></Card>
<div style={{display:'flex',flexDirection:'column',gap:'var(--space-lg)'}}>
{rows.map(r=><div key={r.title} style={{display:'flex',gap:'var(--space-md)',alignItems:'flex-start'}}>
<span style={{flex:'0 0 40px',height:40,borderRadius:'var(--radius-sm)',background:'var(--surface-raised)',border:'1px solid var(--border-hairline)',display:'grid',placeItems:'center'}}>
<Icon name={r.icon} size={20} color="var(--primary)"/></span>
<div style={{flex:1,minWidth:0,display:'flex',flexDirection:'column',gap:2}}>
<span className="zo-h3">{r.title}</span>
<span className="zo-small" style={{color:'var(--text-secondary)',textWrap:'pretty'}}>{r.body}</span></div></div>)}</div></div>
<div className="foot"><Button fullWidth size="lg" icon="chevron-right" iconPosition="right">Next</Button></div>
</div></Frame>}
/* 3 — Topics. Two picks minimum, so the first recommendation has something to stand on. */
function Topics(){const [picked,setPicked]=React.useState(['Decisions','Money']);
const toggle=t=>setPicked(p=>p.includes(t)?p.filter(x=>x!==t):p.concat(t));
return<Frame label="3 · What to think about">
<div className="screen" data-screen-label="Topics">
<StepHeader step={2} skip/>
<div className="body">
<div style={{display:'flex',flexDirection:'column',gap:'var(--space-sm)'}}>
<h1 style={{margin:0,fontFamily:'var(--font-display)',fontWeight:700,fontSize:'var(--text-h1-size)',lineHeight:'var(--text-h1-leading)',color:'var(--text-heading)',textWrap:'pretty'}}>What do you want to think about?</h1>
<span className="zo-small" style={{color:'var(--text-secondary)'}}>Pick two or more. You can change this later.</span></div>
<div style={{display:'flex',flexWrap:'wrap',gap:'var(--space-sm)'}}>
{TOPICS.map(t=>{const on=picked.includes(t);return<button key={t} type="button" onClick={()=>toggle(t)} aria-pressed={on} style={{display:'inline-flex',alignItems:'center',gap:'var(--space-xs)',minHeight:44,padding:'0 var(--space-md)',borderRadius:'var(--radius-full)',background:on?'var(--surface-raised)':'var(--surface-card)',border:(on?'var(--border-width-focus)':'var(--border-width-hairline)')+' solid '+(on?'var(--primary)':'var(--border-hairline)'),color:on?'var(--primary)':'var(--text-body)',fontFamily:'var(--font-display)',fontWeight:'var(--weight-semibold)',fontSize:'var(--text-h3-size)',cursor:'pointer',transition:'background var(--duration-tap) var(--ease-snappy), border-color var(--duration-tap) var(--ease-snappy)'}}>
{on&&<Icon name="check" size={16}/>}{t}</button>})}</div>
<Input label="Something else" placeholder="Name an idea or a book"/></div>
<div className="foot">
<Button fullWidth size="lg" icon="chevron-right" iconPosition="right" disabled={picked.length<2}>Next</Button>
<span className="zo-caption" style={{color:'var(--text-secondary)',textAlign:'center'}}>{picked.length<2?'Pick '+(2-picked.length)+' more':picked.length+' picked'}</span></div>
</div></Frame>}
/* 4 — Daily cap. 15 min is the ceiling the product is designed around, not a stretch goal. */
function Cap(){const [cap,setCap]=React.useState(15),[remind,setRemind]=React.useState(true);
return<Frame label="4 · Daily cap">
<div className="screen" data-screen-label="Daily cap">
<StepHeader step={3}/>
<div className="body">
<div style={{display:'flex',flexDirection:'column',gap:'var(--space-sm)'}}>
<h1 style={{margin:0,fontFamily:'var(--font-display)',fontWeight:700,fontSize:'var(--text-h1-size)',lineHeight:'var(--text-h1-leading)',color:'var(--text-heading)',textWrap:'pretty'}}>How long do you want each day?</h1>
<span className="zo-small" style={{color:'var(--text-secondary)',textWrap:'pretty'}}>Sessions stop at your cap. Fifteen minutes is the longest a session gets.</span></div>
<div style={{display:'flex',flexDirection:'column',gap:'var(--space-sm)'}}>
{CAPS.map(c=>{const on=cap===c.min;return<Card key={c.min} interactive elevation={on?'raised':'card'} onClick={()=>setCap(c.min)} style={{display:'flex',alignItems:'center',gap:'var(--space-md)',minHeight:64,border:(on?'var(--border-width-focus)':'var(--border-width-hairline)')+' solid '+(on?'var(--primary)':'var(--border-hairline)'),cursor:'pointer'}}>
<span style={{flex:'0 0 auto',width:24,display:'grid',placeItems:'center'}}>{on&&<Icon name="check" size={20} color="var(--primary)"/>}</span>
<span style={{flex:1,minWidth:0,display:'flex',flexDirection:'column',gap:2}}>
<span style={{fontFamily:'var(--font-display)',fontWeight:700,fontSize:'var(--text-h2-size)',color:on?'var(--primary)':'var(--text-heading)'}}>{c.min} min</span>
<span className="zo-small" style={{color:'var(--text-secondary)'}}>{c.leaves} a day</span></span></Card>})}</div>
<Card style={{display:'flex',flexDirection:'column'}}>
<Switch checked={remind} onChange={setRemind} label="Reminders" description="One nudge, at 8 pm"/></Card></div>
<div className="foot"><Button fullWidth size="lg" icon="chevron-right" iconPosition="right">Next</Button></div>
</div></Frame>}
/* 5 — First track. Onboarding ends inside a leaf, not on a congratulations screen. */
function First(){return<Frame label="5 · First track">
<div className="screen" data-screen-label="First track">
<StepHeader step={4}/>
<div className="body">
<div style={{display:'flex',flexDirection:'column',gap:'var(--space-sm)'}}>
<h1 style={{margin:0,fontFamily:'var(--font-display)',fontWeight:700,fontSize:'var(--text-h1-size)',lineHeight:'var(--text-h1-leading)',color:'var(--text-heading)',textWrap:'pretty'}}>Start with this one</h1>
<span className="zo-small" style={{color:'var(--text-secondary)',textWrap:'pretty'}}>Picked from decisions and money. Eighteen leaves, three minutes each.</span></div>
<TrackCard title="The quiet arithmetic" author="Marisol Vane" leavesDone={0} leavesTotal={18}/>
<div style={{display:'flex',flexDirection:'column',gap:'var(--space-sm)'}}>
<span className="zo-caption" style={{color:'var(--text-secondary)'}}>First leaf</span>
<Card style={{display:'flex',alignItems:'center',gap:'var(--space-md)'}}>
<span style={{flex:'0 0 40px',height:40,borderRadius:'var(--radius-sm)',background:'var(--surface-raised)',border:'1px solid var(--border-hairline)',display:'grid',placeItems:'center'}}>
<Icon name="play" size={20} color="var(--primary)"/></span>
<span style={{flex:1,minWidth:0,display:'flex',flexDirection:'column',gap:2}}>
<span className="zo-h3">Why the first number wins</span>
<span className="zo-caption" style={{color:'var(--text-secondary)'}}>Leaf 1 · 3 min</span></span></Card></div></div>
<div className="foot">
<Button fullWidth size="lg" icon="play">Start first leaf · 3 min</Button>
<Button fullWidth size="lg" variant="ghost">Choose a different track</Button></div>
</div></Frame>}
function Rail(){return<div className="rail"><Welcome/><How/><Topics/><Cap/><First/></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<Rail/>);
</script>
</body></html>
