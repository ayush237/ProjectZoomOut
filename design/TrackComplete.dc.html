<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Nunito+Sans:wght@400;600&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Nunito', system-ui, sans-serif; }
    a { color: #3DDCC8; } a:hover { color: #5FE6D5; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #0B0F12; color: #F2F5F7; position: relative; overflow: hidden;">

  <!-- The tree in full leaf. The payoff of the whole metaphor. -->
  <svg width="390" height="560" viewBox="0 0 390 560" fill="none" style="position: absolute; top: 176px; left: 0;">
    <path d="M195 540 L195 300" stroke="#26313A" stroke-width="20" stroke-linecap="round"/>
    <path d="M195 420 C 152 392, 116 350, 98 302" stroke="#26313A" stroke-width="12" stroke-linecap="round"/>
    <path d="M195 400 C 240 372, 274 330, 292 282" stroke="#26313A" stroke-width="12" stroke-linecap="round"/>
    <path d="M195 320 C 164 282, 146 236, 144 190" stroke="#26313A" stroke-width="10" stroke-linecap="round"/>
    <path d="M195 300 C 226 262, 248 218, 250 172" stroke="#26313A" stroke-width="10" stroke-linecap="round"/>
    <path d="M195 250 C 190 210, 192 170, 196 132" stroke="#26313A" stroke-width="8" stroke-linecap="round"/>
    <path d="M195 520 C 158 532, 124 542, 96 540" stroke="#26313A" stroke-width="9" stroke-linecap="round"/>
    <path d="M195 520 C 232 532, 266 542, 294 540" stroke="#26313A" stroke-width="9" stroke-linecap="round"/>

    <!-- Every leaf borne. Eighteen. -->
    <g fill="#FFB020">
      <ellipse cx="98" cy="302" rx="16" ry="8.5" transform="rotate(-30 98 302)"/>
      <ellipse cx="72" cy="326" rx="14" ry="7.5" transform="rotate(-22 72 326)"/>
      <ellipse cx="120" cy="272" rx="13" ry="7" transform="rotate(-40 120 272)"/>
      <ellipse cx="292" cy="282" rx="16" ry="8.5" transform="rotate(28 292 282)"/>
      <ellipse cx="318" cy="308" rx="14" ry="7.5" transform="rotate(20 318 308)"/>
      <ellipse cx="270" cy="252" rx="13" ry="7" transform="rotate(38 270 252)"/>
      <ellipse cx="144" cy="190" rx="15" ry="8" transform="rotate(-16 144 190)"/>
      <ellipse cx="120" cy="166" rx="13" ry="7" transform="rotate(-26 120 166)"/>
      <ellipse cx="166" cy="152" rx="13" ry="7" transform="rotate(-8 166 152)"/>
      <ellipse cx="250" cy="172" rx="15" ry="8" transform="rotate(18 250 172)"/>
      <ellipse cx="274" cy="148" rx="13" ry="7" transform="rotate(28 274 148)"/>
      <ellipse cx="228" cy="136" rx="13" ry="7" transform="rotate(10 228 136)"/>
      <ellipse cx="196" cy="132" rx="14" ry="7.5" transform="rotate(0 196 132)"/>
      <ellipse cx="176" cy="106" rx="12" ry="6.5" transform="rotate(-12 176 106)"/>
      <ellipse cx="216" cy="104" rx="12" ry="6.5" transform="rotate(12 216 104)"/>
      <ellipse cx="152" cy="228" rx="12" ry="6.5" transform="rotate(-24 152 228)"/>
      <ellipse cx="242" cy="214" rx="12" ry="6.5" transform="rotate(24 242 214)"/>
      <ellipse cx="196" cy="82" rx="11" ry="6" transform="rotate(0 196 82)"/>
    </g>

    <!-- Two leaves drifting free: the only thing that moves after the burst -->
    <ellipse cx="82" cy="404" rx="10" ry="5.5" transform="rotate(-40 82 404)" fill="#FFC44D" fill-opacity="0.5"/>
    <ellipse cx="310" cy="392" rx="9" ry="5" transform="rotate(34 310 392)" fill="#FFC44D" fill-opacity="0.38"/>
  </svg>

  <div style="position: absolute; top: 0; left: 0; width: 390px; height: 250px; background: linear-gradient(180deg, #0B0F12 0%, #0B0F12 52%, rgba(11,15,18,0) 100%);"></div>
  <div style="position: absolute; bottom: 0; left: 0; width: 390px; height: 300px; background: linear-gradient(0deg, #0B0F12 34%, rgba(11,15,18,0) 100%);"></div>

  <div style="position: absolute; top: 68px; left: 24px; right: 24px; display: flex; flex-direction: column; align-items: center; gap: 10px;">
    <div style="font-family: 'Nunito Sans', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: #FFB020;">Track complete</div>
    <div style="font-size: 32px; font-weight: 700; line-height: 38px; text-align: center;">Your tree is in full leaf</div>
    <div style="font-family: 'Nunito Sans', sans-serif; font-size: 15px; line-height: 22px; text-align: center; color: #A7B6C0;">Eighteen Leaves of <span style="color: #F2F5F7;">The Science of Getting Rich</span>, start to finish.</div>
  </div>

  <div style="position: absolute; bottom: 132px; left: 24px; right: 24px; display: flex; gap: 10px;">
    <div style="flex-grow: 1; background: #141A1E; border: 1px solid #2E3A44; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 3px;">
      <div style="font-size: 22px; font-weight: 700; color: #FFB020;">1,640</div>
      <div style="font-family: 'Nunito Sans', sans-serif; font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #A7B6C0;">XP earned</div>
    </div>
    <div style="flex-grow: 1; background: #141A1E; border: 1px solid #2E3A44; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 3px;">
      <div style="font-size: 22px; font-weight: 700; color: #F2F5F7;">11</div>
      <div style="font-family: 'Nunito Sans', sans-serif; font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #A7B6C0;">Day streak</div>
    </div>
    <div style="flex-grow: 1; background: #141A1E; border: 1px solid #2E3A44; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 3px;">
      <div style="font-size: 22px; font-weight: 700; color: #F2F5F7;">14</div>
      <div style="font-family: 'Nunito Sans', sans-serif; font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #A7B6C0;">First try</div>
    </div>
  </div>

  <div style="position: absolute; bottom: 26px; left: 24px; right: 24px; display: flex; flex-direction: column; gap: 10px;">
    <div style="height: 52px; border-radius: 999px; background: #FFB020; display: flex; align-items: center; justify-content: center; gap: 8px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B0F12" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 15V3M8 7l4-4 4 4"/></svg>
      <span style="font-size: 16px; font-weight: 700; color: #0B0F12;">Share your tree</span>
    </div>
    <div style="height: 48px; border-radius: 999px; border: 1px solid #2E3A44; display: flex; align-items: center; justify-content: center;">
      <span style="font-size: 15px; font-weight: 700; color: #F2F5F7;">Find your next book</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
