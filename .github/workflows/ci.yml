name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A new push to the same branch makes the in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Integration tests spin up their own Postgres via testcontainers, which needs the
  # Docker daemon the ubuntu runner already provides. This value only has to be a
  # valid connection string for the config module to accept at import time.
  DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/zoomout
  NODE_ENV: test
  # apps/admin validates its environment when payload.config.ts is imported, which
  # happens during `next build` as well as under test. These are non-secret CI
  # placeholders: the integration suite overrides the URL with its own container, and
  # nothing here ever reaches a real database.
  PAYLOAD_SECRET: ci-placeholder-secret-at-least-32-characters
  PAYLOAD_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/zoomout_cms

jobs:
  verify:
    name: install → lint → typecheck → test → build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
